<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Outer glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  
  <!-- Letter S -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="320" fill="url(#accent)">S</text>
  
  <!-- Corner dot accent -->
  <circle cx="400" cy="112" r="16" fill="#06b6d4" opacity="0.8"/>
</svg>
